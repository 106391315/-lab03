<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="description" content="CWA Help Desk Appointment Registration Form" />
    <meta name="keywords" content="HTML, Form, Help Desk, CWA" />
    <meta name="author" content="Student Name" />
    <title>CWA Help Desk Appointment</title>
</head>

<body>

    <p>
        <a href="http://www.swin.edu.au">
            <img src="images/logo.png" alt="Swinburne University of Technology Logo" width="200" />
        </a>
    </p>

    <h1>CWA Help Desk Appointment</h1>

    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>

    <form>

        <fieldset>
            <legend>Student details</legend>

            <p>
                <label for="studentid">Student ID</label>
                <input type="text" id="studentid" name="studentid" required="required" pattern="\d{7,10}"
                    title="Please enter between 7 and 10 digits" />
            </p>

            <p>
                <label for="givenname">Given Name</label>
                <input type="text" id="givenname" name="givenname" required="required" maxlength="15"
                    pattern="[a-zA-Z\s]+" title="Only alphabetical characters allowed" />

                <label for="familyname">Family Name</label>
                <input type="text" id="familyname" name="familyname" required="required" maxlength="15"
                    pattern="[a-zA-Z\s]+" title="Only alphabetical characters allowed" />
            </p>
        </fieldset>

        <fieldset>
            <legend>Your unit</legend>

            <p>
                <input type="radio" id="cos10011" name="unit" value="COS10011" required="required" />
                <label for="cos10011">COS10011</label>

                <input type="radio" id="cos60004" name="unit" value="COS60004" />
                <label for="cos60004">COS60004</label>

                <input type="radio" id="cos60007" name="unit" value="COS60007" />
                <label for="cos60007">COS60007</label>
            </p>

            <p>
                <label for="tutor">Your Tutor</label>
                <select id="tutor" name="tutor" required="required">
                    <option value="">Please Select</option>
                    <option value="alice">Alice</option>
                    <option value="bob">Bob</option>
                    <option value="charlie">Charlie</option>
                </select>
            </p>
        </fieldset>

        <fieldset>
            <legend>Issue</legend>

            <p>
                <input type="checkbox" id="issue_html" name="issue[]" value="HTML" checked="checked" />
                <label for="issue_html">HTML</label>

                <input type="checkbox" id="issue_css" name="issue[]" value="CSS" />
                <label for="issue_css">CSS</label>

                <input type="checkbox" id="issue_js" name="issue[]" value="JavaScript" />
                <label for="issue_js">JavaScript</label>

                <input type="checkbox" id="issue_php" name="issue[]" value="PHP" />
                <label for="issue_php">PHP</label>

                <input type="checkbox" id="issue_mysql" name="issue[]" value="MySQL" />
                <label for="issue_mysql">MySQL</label>
            </p>

            <p>
                <label for="description">Description of Issue</label><br />
                <textarea id="description" name="description" rows="4" cols="40"
                    placeholder="Write description of your problem here..."></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Preferred Date / Time</legend>

            <p>
                <label for="date">Date</label>
                <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}"
                    title="Date format: dd/mm/yyyy" />
            </p>

            <p>
                <label for="time">Time</label>
                <input type="text" id="time" name="time" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]"
                    title="Time format: HH:MM" />
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Book" />
            <input type="reset" value="Reset form" />
        </p>

    </form>
</body>

</html>
www.swin.edu.au
